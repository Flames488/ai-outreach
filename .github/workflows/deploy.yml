name: Deploy

# Runs after CI succeeds on main — never in parallel with it, so a broken
# build/test never gets pushed as an image.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.vars.outputs.image_name }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name/tag
        id: vars
        run: |
          echo "image_name=ghcr.io/${{ github.repository }}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_name }}-backend:${{ steps.vars.outputs.image_tag }}
            ${{ steps.vars.outputs.image_name }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_name }}-frontend:${{ steps.vars.outputs.image_tag }}
            ${{ steps.vars.outputs.image_name }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push nginx
        uses: docker/build-push-action@v6
        with:
          context: ./docker/nginx
          file: docker/nginx/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_name }}-nginx:${{ steps.vars.outputs.image_tag }}
            ${{ steps.vars.outputs.image_name }}-nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Optional: only runs once a target host is configured. Until then
    # this job is skipped and the images above just sit in GHCR, pullable
    # by hand — see docs/deployment.md for the manual first-time setup a
    # host needs before this can deploy to it automatically.
    if: ${{ secrets.DEPLOY_HOST != '' }}
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            export IMAGE_NAME=${{ needs.build-and-push.outputs.image_name }}
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            echo "IMAGE_NAME=$IMAGE_NAME" > .env.deploy
            echo "IMAGE_TAG=$IMAGE_TAG" >> .env.deploy
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.deploy pull
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.deploy up -d
            docker image prune -f
