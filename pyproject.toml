[project]
name = "flames-workspace"
version = "0.1.0"
description = "Flames — autonomous job search, application, and tracking assistant"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["backend", "shared"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic autogenerates these — hand-editing to satisfy lint would defeat
# the point of `alembic revision --autogenerate`.
extend-exclude = ["backend/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP046/UP047: PEP 695 generic syntax (`class Foo[T]:`) is 3.12-only.
# Docker runs 3.12, but local dev venvs on this machine may only have
# 3.11 available — Generic[T]/TypeVar stays importable on both.
ignore = ["UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = true

# No py.typed marker / no typeshed stubs exist for these — genuinely
# untyped at the source, not just missing an installable stub package
# (unlike jose/passlib, handled via types-python-jose/types-passlib).
[[tool.mypy.overrides]]
module = ["celery.*", "googleapiclient.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true

# Celery's task/signal decorators (celery.app.task.Task.task,
# celery.signals.*.connect) carry no type info at all — every module that
# decorates with them would otherwise fail strict's disallow_untyped_decorators
# on every single task/handler, which isn't a bug in our code to fix.
[[tool.mypy.overrides]]
module = ["app.tasks.*", "app.scheduler.logging_signals"]
disallow_untyped_decorators = false
