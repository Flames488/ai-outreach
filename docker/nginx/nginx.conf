upstream flames_api {
    server api:8000;
}

upstream flames_frontend {
    server frontend:80;
}

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
gzip_min_length 1024;

server {
    listen 80;

    client_max_body_size 20M;

    # Nginx's own healthcheck target — doesn't proxy anywhere, so it stays
    # up even if api is temporarily unhealthy.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://flames_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React dashboard (Phase 4) — everything else falls through to it, and
    # its own nginx handles the SPA fallback to index.html.
    location / {
        proxy_pass http://flames_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# TLS termination is added once a domain + certificate exist (production
# deploy phase) — local/dev runs HTTP only.
