[project]
name = "flames-shared"
version = "0.1.0"
description = "Shared DTOs, enums, and constants used across every Flames service"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flames_shared"]
