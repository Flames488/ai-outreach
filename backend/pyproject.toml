[project]
name = "flames-backend"
version = "0.1.0"
description = "Flames API, Celery workers, and scheduler"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "flower>=2.0",
    "redis>=5.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-jose[cryptography]>=3.3",
    "passlib[argon2,bcrypt]>=1.7",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "openai>=1.54",
    "google-api-python-client>=2.149",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "prometheus-fastapi-instrumentator>=7.0",
    "playwright>=1.48",
    "flames-shared",
]

# Playwright's Python package is a normal dependency, but the Chromium
# binary it drives is not pip-installed — `playwright install chromium`
# (or `--with-deps chromium` in the Docker image) has to run separately.

[tool.uv.sources]
flames-shared = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "factory-boy>=3.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
